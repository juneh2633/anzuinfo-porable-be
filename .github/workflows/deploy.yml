name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/juneh2633/anzuinfo-porable-be
  IMAGE_TAG: ${{ github.sha }}
  DEPLOY_DIR: ${{ vars.PROD_DEPLOY_DIR || '/home/ubuntu/anzuinfo-porable-be' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PROD_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            strict_host_key_checking=yes
          else
            touch ~/.ssh/known_hosts
            strict_host_key_checking=accept-new
          fi
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host *
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
            StrictHostKeyChecking $strict_host_key_checking
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync deployment files
        env:
          PROD_HOST: ${{ secrets.SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$PROD_SSH_USER@$PROD_HOST" "mkdir -p '$DEPLOY_DIR'"
          scp docker-compose.yml "$PROD_SSH_USER@$PROD_HOST:$DEPLOY_DIR/docker-compose.yml"
          scp -r docker "$PROD_SSH_USER@$PROD_HOST:$DEPLOY_DIR/"

      - name: Log in to GHCR on production server
        env:
          PROD_HOST: ${{ secrets.SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$PROD_SSH_USER@$PROD_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy and migrate
        env:
          PROD_HOST: ${{ secrets.SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$PROD_SSH_USER@$PROD_HOST" "DEPLOY_DIR='$DEPLOY_DIR' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
            set -euo pipefail
            cd "$DEPLOY_DIR"

            docker pull "ghcr.io/juneh2633/anzuinfo-porable-be:$IMAGE_TAG"
            IMAGE_TAG="$IMAGE_TAG" docker compose -p anzuinfo-porable-be up \
              -d --no-deps --force-recreate --remove-orphans app

            ready=false
            for attempt in $(seq 1 15); do
              if curl -fsS http://localhost:3000/healthcheck >/dev/null; then
                ready=true
                break
              fi
              echo "Waiting for application... ($attempt/15)"
              sleep 2
            done

            if [ "$ready" != true ]; then
              echo "Application did not become ready within 30 seconds."
              docker compose -p anzuinfo-porable-be logs --tail=100 app
              exit 1
            fi

            IMAGE_TAG="$IMAGE_TAG" docker compose -p anzuinfo-porable-be exec -T app \
              npx prisma migrate deploy
            curl -fsS http://localhost:3000/chart/cache >/dev/null || true
            docker image prune -f
          REMOTE
